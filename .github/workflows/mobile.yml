name: Mobile checks and preview

on:
  push:
    branches: [main, codex/mobile-i18n]
    tags: ['mobile-v*']
    paths: ['plaud-app/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['plaud-app/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plaud-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - run: flutter build apk --release --no-pub
      - name: Prepare preview assets
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p build/preview
          cp build/app/outputs/flutter-apk/app-release.apk build/preview/RecDock-0.3.1-preview.1-android.apk
          python3 tool/preview_manifest.py build/preview
          cd build/preview
          sha256sum RecDock-*.apk build-info.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview
          path: plaud-app/build/preview/
          retention-days: 14
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plaud-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Verify packaged language resources
        run: |
          plutil -lint build/ios/iphonesimulator/Runner.app/en.lproj/InfoPlist.strings
          plutil -lint build/ios/iphonesimulator/Runner.app/zh-Hans.lproj/InfoPlist.strings
          plutil -lint build/ios/iphonesimulator/Runner.app/en.lproj/Localizable.strings
          plutil -lint build/ios/iphonesimulator/Runner.app/zh-Hans.lproj/Localizable.strings

  publish:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-preview
          path: preview
      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" preview/* \
            --verify-tag --prerelease --latest=false \
            --title 'RecDock Mobile 0.3.1 preview 1 · English / 中文' \
            --notes-file plaud-app/docs/mobile-0.3.1-preview-notes.md
